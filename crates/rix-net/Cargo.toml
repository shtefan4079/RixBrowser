[package]
name = "rix-net"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rix-core = { path = "../rix-core" }
rix-storage = { path = "../rix-storage" }
tokio = { workspace = true }
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full", "tokio"] }
http-body-util = "0.1"
bytes = "1.10"

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.10"
webpki-roots = "0.26"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime", "system-config"] }

quinn = { version = "0.11", features = ["runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1.3"

flate2 = { version = "1.0", default-features = false, features = ["miniz_oxide"] }
brotli = { version = "7.0", default-features = false, features = ["std"] }

mime_guess = "2.0"
httpdate = "1.0"
psl = "2"
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
