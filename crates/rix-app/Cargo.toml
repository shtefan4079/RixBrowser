[package]
name = "rix-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "rix-browser"
path = "src/main.rs"

[lib]
name = "rix_app"
path = "src/lib.rs"

[dependencies]
rix-core = { path = "../rix-core" }
rix-storage = { path = "../rix-storage" }
rix-net = { path = "../rix-net" }
rix-chrome = { path = "../rix-chrome" }
rix-render = { path = "../rix-render" }
rix-ipc = { path = "../rix-ipc" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
winit = "0.30"
softbuffer = { version = "0.4", optional = true }
pollster = "1.0"
vello = "0.10"

[features]
default = []
software = ["dep:softbuffer"]

[dev-dependencies]
tempfile = { workspace = true }
